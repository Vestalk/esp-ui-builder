# 3.2" TFT SPI 240x320 with a resistive touch panel, ILI9341 controller.
model: ILI9341-3.2
title: '3.2" TFT SPI 240×320 з сенсором (ILI9341)'
controller: ILI9341
width: 240
height: 320
color_format: RGB565
interface: spi-4wire
invert: false
touch: xpt2046
spi_hz:
  default: 40000000
  max: 80000000
default_pins:
  sck: 12
  mosi: 11
  dc: 9
  cs: 10
  rst: 8
  bl: 7
