# 3.5" IPS TFT SPI 480x320, ILI9488 controller (the common red / black modules).
model: ILI9488-3.5
title: '3.5" IPS TFT SPI 480×320 (ILI9488)'
controller: ILI9488
# Physical size in portrait orientation (rotation 0/2); 1/3 swap them.
width: 320
height: 480
# Over SPI the ILI9488 only takes 18-bit colour: the driver sends 3 bytes per pixel.
color_format: RGB666
interface: spi-4wire
# Most IPS modules show right colours without inversion; switch it in "Дисплей" if not.
invert: false
spi_hz:
  default: 40000000
  max: 80000000
default_pins:
  sck: 12
  mosi: 11
  dc: 9
  cs: 10
  rst: 8
  bl: 7
