# 1.28" round TFT SPI 240x240, GC9A01 controller.
model: GC9A01-1.28
title: '1.28" круглий TFT SPI 240×240 (GC9A01)'
controller: GC9A01
width: 240
height: 240
color_format: RGB565
interface: spi-4wire
invert: true
shape: round
spi_hz:
  default: 40000000
  max: 80000000
default_pins:
  sck: 12
  mosi: 11
  dc: 9
  cs: 10
  rst: 8
  bl: 7
